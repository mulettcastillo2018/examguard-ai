# Integración continua: en cada push a main y en cada pull request se verifica todo
# contra una base PostgreSQL desechable (nunca la real).
#
# ESLint y Playwright se instalan solo aquí: la red corporativa donde se desarrolla
# bloquea algunas de sus dependencias (ver docs/DECISIONES.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: examguard
          POSTGRES_PASSWORD: examguard
          POSTGRES_DB: examguard_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U examguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores solo para esta base desechable.
      DATABASE_URL: postgresql://examguard:examguard@localhost:5432/examguard_ci
      DIRECT_URL: postgresql://examguard:examguard@localhost:5432/examguard_ci
      BETTER_AUTH_SECRET: secreto-solo-para-ci-0123456789abcdefghijklmnop
      BETTER_AUTH_URL: http://localhost:3000
      SEED_PASSWORD: Demo-CI-ExamGuard-2026
      E2E_PASSWORD: Demo-CI-ExamGuard-2026
      # Las pruebas E2E inician sesión muchas veces desde la misma IP; en producción el límite es 5.
      AUTH_SIGNIN_MAX_PER_MINUTE: "100"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Migraciones
        run: npm run db:migrate

      - name: El esquema coincide con las migraciones
        run: npm run db:check

      - name: Datos de demostración
        run: npm run db:seed

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: |
          npm install --no-save eslint@9 eslint-config-next@16.3.6
          npx eslint . -f json -o eslint-report.json || true
          node scripts/ci/eslint-annotations.mjs eslint-report.json

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas de integración (con base de datos)
        run: npm run test:integration

      - name: Build de producción
        run: npm run build

      - name: Pruebas de punta a punta (Playwright)
        run: |
          npm install --no-save @playwright/test@1.63.0
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Trazas de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # La imagen de Docker de producción: se construye, arranca contra una base desechable
  # (aplica las migraciones al iniciar) y responde con la base conectada.
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: examguard
          POSTGRES_PASSWORD: examguard
          POSTGRES_DB: examguard_docker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U examguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen
        run: docker build -t examguard-ai:ci .

      - name: La imagen no lleva secretos y trae los modelos
        run: |
          docker run --rm --entrypoint sh examguard-ai:ci -c 'test ! -e .env && test -f public/models/blaze_face_short_range.tflite && test -f public/mediapipe/vision_wasm_internal.wasm'

      - name: Arrancar el contenedor
        env:
          DATABASE_URL: postgresql://examguard:examguard@localhost:5432/examguard_docker
          DIRECT_URL: postgresql://examguard:examguard@localhost:5432/examguard_docker
          BETTER_AUTH_SECRET: secreto-solo-para-ci-0123456789abcdefghijklmnop
          BETTER_AUTH_URL: http://localhost:3000
        run: docker run -d --name examguard --network host -e DATABASE_URL -e DIRECT_URL -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL examguard-ai:ci

      - name: Responde con la base conectada y las cabeceras de seguridad
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"db":true'
          curl -fsSI http://localhost:3000/login | tee headers.txt
          grep -qi "content-security-policy: default-src 'self'" headers.txt
          grep -qi "permissions-policy: camera=(self), microphone=(self)" headers.txt

      # Los registros de los jobs no son públicos; las anotaciones sí.
      - name: Registro del contenedor si algo falla
        if: failure()
        run: docker logs examguard 2>&1 | tail -40 | sed 's/^/::error title=Contenedor::/' 
